[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iasi-retrieval"
version = "0.1.0"
description = "Reproducible z24/Ncol retrieval on IASI 714-1250 cm^-1"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "photonix>=0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["iasi_retrieval*"]
