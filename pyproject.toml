[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyLBLRTM"
version = "0.1.0"
description = "Line-by-line radiative transfer model for atmospheric remote sensing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
hapi = ["hitran-api>=1.3"]   # necesario solo para from_hapi() y descarga HITRAN
plot = ["matplotlib>=3.7"]
dev  = ["pytest>=7", "sphinx>=7", "sphinx-rtd-theme"]

[project.urls]
Repository = "https://github.com/OscarMigue9/PyLBLRTM"

[tool.setuptools.packages.find]
where = ["."]
include = ["pylblrtm*"]
